<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Returning to your course</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body onload="document.forms[0].submit()">
<main>
    <h1>Returning to your course</h1>
    <p class="lede">
        Sending <span th:text="${count}">0</span> item(s) back to the LMS. If this page does not
        close by itself, use the button.
    </p>

    <!--
      The response travels through the browser as a form post, not a server-to-server call.
      The JWT below is signed with this tool's private key; the LMS verifies it against the
      public key at our JWKS endpoint. That signature is the only reason the LMS can trust a
      payload that passed through the user's browser.
    -->
    <form method="post" th:action="${returnUrl}">
        <input type="hidden" name="JWT" th:value="${jwt}">
        <button type="submit">Continue</button>
    </form>
</main>
</body>
</html>
